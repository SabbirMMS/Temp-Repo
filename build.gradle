plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.nursiam.amarbanglaschool'
    compileSdk 36

    defaultConfig {
        applicationId "com.nursiam.amarbanglaschool"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core


    //..................Admob ads..............................................
    implementation 'com.google.android.gms:play-services-ads:24.9.0'

    //..................Cardview..............................................
    implementation 'androidx.cardview:cardview:1.0.0'

    //.................Lottie animation......................................
    implementation 'com.airbnb.android:lottie:6.4.1'

    //.................Volley for server.....................................
    implementation 'com.android.volley:volley:1.2.1'

    //.................App update ...........................................
    implementation 'com.google.android.play:app-update:2.1.0'

    //................bottom nagavition bar..................................
    implementation 'com.github.ismaeldivita:chip-navigation-bar:1.4.0'

    //,,,,,,,,,,,,,,,Image Slaider,,,,,,,,,,,,,,,,,..........................
    implementation 'com.github.denzcoskun:ImageSlideshow:0.1.2'

    //...............Native templates........................................
    // implementation project(':nativetemplates')

    //................ GDPR massage labrarry................................
    //  implementation 'com.google.android.ump:user-messaging-platform:3.1.0'

    //................ Facebook sdk labrarry................................
    //implementation 'androidx.annotation:annotation:1.9.1'
    //implementation 'com.facebook.android:audience-network-sdk:6.19.0'

    //................ Sdp best xml design labrarry.........................
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'

